name: Баг
description: Инструмент ведёт себя не так, как заявлено.
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Версия
      description: Вывод `leettest --version` или хеш коммита.
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Платформа
      options:
        - Linux
        - macOS
        - Windows
        - Docker
        - Другое
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Конфиг
      description: Файл, с которым запускали. Уберите адреса и секреты.
      render: yaml
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
      description: Вывод целиком, включая сообщение об ошибке.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
      description: Команда и шаги. Если нужен конкретный сервис — опишите, какой.
    validations:
      required: true
