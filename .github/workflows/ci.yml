name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_LATEST: "1.27.1"
  GOLANGCI_LINT_VERSION: "v2.13.2"

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The lower bound is the version declared in go.mod: if it stops
        # compiling there, the module's compatibility claim is wrong.
        go: ["1.25", "1.27.1"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...

  # A stable name for branch protection: the matrix job names carry a Go version
  # and would have to be re-registered on every bump.
  tests:
    name: tests
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Fail unless every matrix job passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "matrix result: ${{ needs.test.result }}"
            exit 1
          fi

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_LATEST }}
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  licenses:
    name: dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_LATEST }}
      - run: go install github.com/google/go-licenses@latest
      - name: Check licenses
        run: |
          go-licenses check ./... \
            --allowed_licenses=Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC
