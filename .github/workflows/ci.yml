name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_LATEST: "1.27.1"
  GOLANGCI_LINT_VERSION: "v2.14.0"

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The lower bound is the version declared in go.mod: if it stops
        # compiling there, the module's compatibility claim is wrong.
        go: ["1.26", "1.27.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...

  # A stable name for branch protection: the matrix job names carry a Go version
  # and would have to be re-registered on every bump.
  tests:
    name: tests
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Fail unless every matrix job passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "matrix result: ${{ needs.test.result }}"
            exit 1
          fi

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_LATEST }}
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  licenses:
    name: dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_LATEST }}
      - run: go install github.com/google/go-licenses@latest
      - name: Check licenses
        run: |
          go-licenses check ./... \
            --allowed_licenses=Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC

  # The release runs only on a tag; building it here keeps a broken
  # .goreleaser.yaml from surfacing first at release time.
  release-build:
    name: release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_LATEST }}
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "v2.18.2"
          args: release --snapshot --clean
      # The same build and check as release.yml, on every PR: a step that only
      # runs on a tag is first tried on the release. The snapshot's tag
      # (v0.0.0 before any tag) stands in for GITHUB_REF_NAME.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "v2.18.2"
          args: build --snapshot --single-target --clean --output dist/leettest-check
      - name: version matches the tag
        run: |
          got=$(dist/leettest-check -version)
          want="leettest $(jq -r .tag dist/metadata.json)"
          echo "$got"
          [ "$got" = "$want" ] || { echo "::error::-version printed '$got', want '$want'"; exit 1; }
