name: Stress

# Every test many times under -race, nightly: a flaky test passes a PR's single
# run and fails one run in fifty. A failure opens an issue, or comments on the
# open one, so it does not rest in a mail to whoever last touched the cron.
# GitHub disables a scheduled workflow after 60 days without commits to a
# public repo; re-enable it under Actions after a quiet spell.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress:
    name: stress (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # The floor from go.mod and GO_LATEST from ci.yml; tool-versions.yml
        # checks the second.
        go: ["1.26", "1.27.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      # 20 runs of the slowest package took ~23 min in Docker on 2 CPUs; the
      # default 10 min per test binary would cut it short.
      - run: go test -race -count=20 -timeout 90m ./... 2>&1 | tee stress.log
        shell: bash -o pipefail {0}
      - name: keep the failures
        if: failure()
        run: |
          grep -E -- '--- FAIL|_test.go:[0-9]+:|panic:|WARNING: DATA RACE' stress.log | head -100 > failures.txt || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: stress-go${{ matrix.go }}
          path: failures.txt

  report:
    name: report a failure
    runs-on: ubuntu-latest
    needs: stress
    if: failure()
    permissions:
      issues: write
    steps:
      - name: open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly stress run failed"
          body="Run: $RUN (commit ${GITHUB_SHA::7}). The failing tests are in the run's artifacts."
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
