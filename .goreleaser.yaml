# Release build: binaries for the tag, pushed by .github/workflows/release.yml.
version: 2

# Otherwise taken from the git remote: a clone under another name ships
# grpc-loadgen_*.tar.gz.
project_name: leettest

builds:
  - id: leettest
    main: ./cmd/leettest
    binary: leettest
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Tag }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# A tag with a suffix (v0.1.0-rc.1) is a pre-release; the default would ship
# it as the latest release.
release:
  prerelease: auto

changelog:
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
